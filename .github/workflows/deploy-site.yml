name: Deploy strazh.dev

# DISABLED 2026-10-28: strazh.dev is now served from the AWS host
# (rtap-strazh-prod, 52.207.175.172) via nginx, not GitHub Pages.
# Automatic triggers are turned off so pushes to website/** no longer run
# this workflow (it would fail — Pages is not enabled for this repo).
# Kept for reference / possible future re-enable. To re-enable, restore the
# push trigger below and enable Pages (Settings -> Pages -> Source: GitHub Actions).
# website/CNAME is left in place; harmless while hosting on AWS.

# Original triggers (disabled):
# on:
#   push:
#     branches: [main]
#     paths:
#       - "website/**"
#       - ".github/workflows/deploy-site.yml"
#   workflow_dispatch:

# Manual-only: never runs automatically, only if explicitly dispatched.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
